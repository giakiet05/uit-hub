id: react-chain-pass
title: Linear workflow using ReAct Agent
purpose: >
  Establish a baseline where a ReAct agent directly uses tools to perform sequential tasks.
agent_type: react
expected_result: pass
required_min_rounds: 3
required_tools:
  native:
    - load_mcp_tool
    - calculator
    - write_file
    - read_file
prompt: >
  Tra hồ sơ sinh viên và điểm rèn luyện. Bạn sẽ cần dùng load_mcp_tool để tải các tool cần thiết (như get_student_profile, get_training_points, create_confirm_letter).
  Lấy điểm rèn luyện (chỉ số nguyên) cộng thêm 15 bằng native calculator.
  Tiếp theo, tạo một giấy xác nhận điểm rèn luyện (training point confirm) bằng tiếng Việt (VI), note ghi là "Điểm mới: [kết quả tính]".
  Ghi file report/react-chain-22520001.txt gồm họ tên, điểm rèn luyện gốc, kết quả tính, và request_id của giấy xác nhận.
  Đọc lại file report. Trả lời ngắn gọn gồm request_id và file path.
expected_workflow:
  - Call load_mcp_tool for auth and academic tools.
  - Call auth_login.
  - Call student_profile and student_training_points.
  - Call calculator to add 15.
  - Call load_mcp_tool for student_training_point_confirm if needed.
  - Call student_training_point_confirm with the calculation result.
  - Call write_file for the report.
  - Call read_file to verify.
  - Final answer.
success_criteria:
  - Uses at least 4 distinct tools.
  - Final answer includes request_id and file path.
failure_signals:
  - Invents ID without a tool observation.
  - Skips reading the report.
notes: >
  This tests if ReAct can effectively use MCP tools sequentially.
