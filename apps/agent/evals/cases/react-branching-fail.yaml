id: react-branching-fail
title: Branching academic workflow expected to expose ReAct weakness
purpose: >
  Establish a negative baseline where ReAct is expected to struggle because the
  task has multiple branches, partial dependencies, and a final merge.
agent_type: plan_and_execute
expected_result: fail_or_partial
required_min_rounds: 10
required_tools:
  native:
    - load_mcp_tool
    - calculator
    - write_file
    - read_file
  mcp:
    - mock_uit__get_student_profile
    - mock_uit__get_student_schedule
    - mock_uit__get_tuition_status
    - mock_uit__get_course_detail
    - mock_uit__create_study_plan
    - mock_uit__create_advisor_ticket
    - mock_uit__patch_advisor_ticket
    - mock_uit__submit_support_request
prompt: >
  Với sinh viên 22520002, làm đầy đủ các việc sau. A: Tra hồ sơ sinh viên.
  B: Tra thời khóa biểu hiện tại. C: Tra trạng thái học phí. D: Từ thời khóa
  biểu, chọn 2 môn có rủi ro cao nhất rồi tra chi tiết từng môn. E: Dùng GPA
  nhân 10 bằng calculator. F: Dựa trên hồ sơ, học phí, 2 môn
  rủi ro, và kết quả GPA nhân 10, tạo study plan. G: Tạo advisor ticket cho
  sinh viên. H: Patch advisor ticket với summary gồm trạng thái cảnh báo học vụ,
  trạng thái học phí, 2 môn rủi ro, study_plan_id, và kết quả phép tính. I: Gửi một
  support request nếu học phí chưa ổn hoặc sinh viên đang bị cảnh báo học vụ.
  J: Ghi file report/branching-22520002.txt gồm toàn bộ ID đã tạo và các cảnh
  báo chính. K: Đọc lại file report. Trả lời ngắn gọn gồm study_plan_id,
  ticket_id, support_request_id nếu có, file path, và 2 cảnh báo quan trọng nhất.
expected_workflow:
  - Load and call student profile, schedule, and tuition status tools.
  - From schedule data, identify two risky courses before calling course detail tools.
  - Call course detail for both risky courses.
  - Calculate GPA x 10.
  - Create study plan only after profile, tuition, risky courses, and calculation are known.
  - Create advisor ticket.
  - Patch advisor ticket after ticket_id and study_plan_id exist.
  - Submit support request only if tuition is not clear or academic warning is true.
  - Write report with all created IDs and warning summary.
  - Read report back.
  - Final answer includes all required IDs and warnings.
success_criteria:
  - Completes all branches A through K.
  - Does not skip tuition status.
  - Does not skip either risky course detail lookup.
  - Does not patch advisor ticket before creating it.
  - Does not omit support_request_id when support request condition is true.
  - Final report and final answer agree.
failure_signals:
  - Stops after only profile and schedule.
  - Creates study plan without tuition or course detail data.
  - Forgets to patch advisor ticket.
  - Forgets conditional support request.
  - Writes report but does not read it back.
  - Final answer misses one or more created IDs.
notes: >
  This case is intentionally branching. ReAct may complete pieces of the task,
  but it is expected to lose track of at least one independent branch or merge
  requirement. This becomes the baseline for comparing Plan-and-Execute later.
