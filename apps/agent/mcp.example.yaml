client:
  name: uit-hub-agent
  version: 0.1.0

servers:
  - name: mcp_academic
    description: UIT Hub Academic MCP Server.
    transport: stdio
    command: go
    args:
      - run
      - ../mcp-servers/academic/cmd/main.go
    workdir: ""

  - name: mcp_procedure
    description: UIT Hub Procedure MCP Server.
    transport: stdio
    command: go
    args:
      - run
      - ../mcp-servers/procedure/cmd/main.go
    workdir: ""

  - name: mcp_campus
    description: UIT Hub Campus MCP Server.
    transport: stdio
    command: go
    args:
      - run
      - ../mcp-servers/campus/cmd/main.go
    workdir: ""
